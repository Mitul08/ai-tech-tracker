name: Daily AI Tech Tracker

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_TRACKER_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Fetch latest AI news
        run: python tracker.py

      - name: Generate AI news report
        run: python generate_report.py

      - name: Commit and push updates
        run: |
          git config user.name "Mitul08"
          git config user.email "141028305+Mitul08@users.noreply.github.com"

          git add data/latest_news.json AI_NEWS_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automated AI news update"
            git push
          fi
